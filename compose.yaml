# Backups. Jobs report their runs and restore tests; Backups tracks them and makes no backups (ADR 0048).
#
#   openssl rand -hex 32 > openasy-kek   # this key: sign-in secrets (ADR 0021). Keep it with your backups
#   docker compose up -d
#   docker compose logs backups | grep 'no owner yet'   # the one-time link that creates the owner account
services:
  backups:
    image: ghcr.io/openasy/backups:0.1.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080"   # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - backups-data:/data   # SQLite database: jobs, runs and restore tests
      # - ./hosts.yaml:/config/hosts.yaml:ro   # the install's servers, to see which ones have no backup job
    secrets:
      - openasy-kek   # mounted at /run/secrets/openasy-kek
    environment:
      # The install's hosts file (ADR 0052), to list servers with no backup job:
      # OPENASY_HOSTS: /config/hosts.yaml
      # The address people open Backups at; with a TLS proxy in front, its https:// URL.
      BACKUPS_PUBLIC_URL: ${BACKUPS_PUBLIC_URL:-http://localhost:8080}
      # For the jobs: it can report runs and restore tests and nothing else. Or use an API token with the editor role from Settings.
      BACKUPS_INGEST_TOKEN: ${BACKUPS_INGEST_TOKEN:-}
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: backups
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

volumes:
  backups-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
